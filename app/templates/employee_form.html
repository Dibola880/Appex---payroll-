{% extends "base.html" %}

{% block title %}Add Employee - Appex Payroll{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add Employee</h1>
        <p>Add an employee to your company's payroll.</p>
    </div>

    <a class="btn secondary" href="{{ url_for('main.employees') }}">
        Back to Employees
    </a>
</div>


<div class="card">

    <form method="POST">

        <div class="form-grid">

            <!-- Employee Number -->
            <div class="form-group">
                <label for="employee_number">
                    Employee Number
                </label>

                <input
                    type="text"
                    id="employee_number"
                    name="employee_number"
                    placeholder="EMP001"
                    required
                >
            </div>


            <!-- First Name -->
            <div class="form-group">
                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="First name"
                    required
                >
            </div>


            <!-- Last Name -->
            <div class="form-group">
                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Last name"
                    required
                >
            </div>


            <!-- Date of Birth -->
            <div class="form-group">
                <label for="date_of_birth">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="date_of_birth"
                    name="date_of_birth"
                >

                <small>
                    Used for age-based PAYE rebate calculations.
                </small>
            </div>


            <!-- Email -->
            <div class="form-group">
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="employee@example.com"
                >
            </div>


            <!-- Job Title -->
            <div class="form-group">
                <label for="job_title">
                    Job Title
                </label>

                <input
                    type="text"
                    id="job_title"
                    name="job_title"
                    placeholder="Job title"
                >
            </div>


            <!-- Monthly Salary -->
            <div class="form-group">
                <label for="monthly_salary">
                    Monthly Salary
                </label>

                <input
                    type="number"
                    id="monthly_salary"
                    name="monthly_salary"
                    step="0.01"
                    min="0"
                    placeholder="15000.00"
                    required
                >
            </div>


            <!-- Status -->
            <div class="form-group">
                <label for="status">
                    Employment Status
                </label>

                <select
                    id="status"
                    name="status"
                >
                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>
                </select>
            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn"
            >
                Save Employee
            </button>

            <a
                href="{{ url_for('main.employees') }}"
                class="btn secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
