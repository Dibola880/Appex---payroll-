{% extends "base.html" %}

{% block title %}Add Employee - Appex Payroll{% endblock %}

{% block heading %}Add Employee{% endblock %}

{% block content %}

<div class="card">

    <h2>Employee Information</h2>

    <p>
        Enter the employee's details below to add them to your
        Appex Payroll account.
    </p>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label for="employee_number">
                    Employee Number
                </label>

                <input
                    type="text"
                    id="employee_number"
                    name="employee_number"
                    placeholder="EMP001"
                    required
                >
            </div>


            <div class="form-group">
                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="John"
                    required
                >
            </div>


            <div class="form-group">
                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Doe"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="employee@example.com"
                >
            </div>


            <div class="form-group">
                <label for="job_title">
                    Job Title
                </label>

                <input
                    type="text"
                    id="job_title"
                    name="job_title"
                    placeholder="Sales Consultant"
                >
            </div>


            <div class="form-group">
                <label for="monthly_salary">
                    Monthly Salary (R)
                </label>

                <input
                    type="number"
                    id="monthly_salary"
                    name="monthly_salary"
                    placeholder="15000.00"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="button"
            >
                Save Employee
            </button>

            <a
                href="{{ url_for('main.employees') }}"
                class="button secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
