{% extends "base.html" %}

{% block title %}Add Employee - Appex Payroll{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Add Employee</h1>

        <p class="muted">
            Add a new employee to your company payroll.
        </p>
    </div>

    <a
        class="button"
        href="{{ url_for('main.employees') }}"
    >
        ← Back to Employees
    </a>

</div>


<div class="card">

    <h2>Employee Information</h2>

    <form
        method="POST"
        action="{{ url_for('main.new_employee') }}"
    >

        <div class="grid">

            <div>

                <label for="employee_number">
                    Employee Number
                </label>

                <input
                    type="text"
                    id="employee_number"
                    name="employee_number"
                    placeholder="EMP001"
                    required
                >

            </div>


            <div>

                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="First name"
                    required
                >

            </div>


            <div>

                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Last name"
                    required
                >

            </div>


            <div>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="employee@example.com"
                >

            </div>


            <div>

                <label for="date_of_birth">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="date_of_birth"
                    name="date_of_birth"
                >

                <small class="muted">
                    Used to calculate the employee's applicable tax rebate.
                </small>

            </div>


            <div>

                <label for="job_title">
                    Job Title
                </label>

                <input
                    type="text"
                    id="job_title"
                    name="job_title"
                    placeholder="Job title"
                >

            </div>


            <div>

                <label for="monthly_salary">
                    Monthly Salary
                </label>

                <input
                    type="number"
                    id="monthly_salary"
                    name="monthly_salary"
                    step="0.01"
                    min="0"
                    placeholder="15000.00"
                    required
                >

            </div>


            <div>

                <label for="status">
                    Employment Status
                </label>

                <select
                    id="status"
                    name="status"
                >

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="button"
            >
                Add Employee
            </button>

            <a
                class="button"
                href="{{ url_for('main.employees') }}"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
